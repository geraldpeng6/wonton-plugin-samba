# 云吞插件：Samba。镜像用上游 dockurr/samba，按清单列表（index）的摘要固定；选型和没选的镜像见 PR 描述。
name: samba
services:
  samba:
    # dockurr/samba 不含发现服务（WS-Discovery/mDNS），入口脚本按 USER/UID/GID 建唯一的 SMB 账号，
    # 密码从 /run/secrets/pass 读（见它的 samba.sh），不进容器环境。
    image: dockurr/samba:4.23.10@sha256:2a0452a12b7a244a22f18d0f233101bb8d4952b5500ae263905e3b9dad3bf2ae
    environment:
      USER: ${WONTON_OWNER_NAME}
      UID: "${PUID}"
      GID: "${PGID}"
      # 镜像自带 PASS=secret；清空后密码只认 /run/secrets/pass，文件为空时账号建为禁用密码，不落到弱口令。
      PASS: ""
    volumes:
      - ${WONTON_SHARE_PHOTOS}:/shares/photos
      - ${WONTON_SHARE_DOCUMENTS}:/shares/documents
      - ${WONTON_SHARE_MUSIC}:/shares/music
      - ${WONTON_SHARE_DOWNLOADS}:/shares/downloads
      - ${WONTON_SHARE_TRANSFERS}:/shares/transfers
    configs:
      - source: smb-conf
        target: /etc/samba/smb.conf
      - source: samba-pass
        target: /run/secrets/pass
        mode: 0400
    healthcheck:
      # 用真实凭据列出共享：SMB 协商、账号和共享都可用才算健康。
      test: ["CMD-SHELL", "smbclient --configfile=/etc/samba/smb.conf -L //127.0.0.1 -U \"$$USER%$$(cat /run/secrets/pass)\" -m SMB3 | grep -q transfers"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 1s

  web:
    # 连接信息页：stdlib 的 http.server，无框架（web/serve.py）。
    image: python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    user: "${PUID}:${PGID}"
    command: ["python3", "/app/serve.py"]
    environment:
      WONTON_LAN_ADDRESSES: ${WONTON_LAN_ADDRESSES}
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME}
    configs:
      - source: serve-py
        target: /app/serve.py
      - source: web-pass
        target: /run/wonton/samba-pass
        mode: 0444
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  smb-conf:
    content: |
      [global]
          server string = wonton
          server role = standalone server
          # 最低 SMB3；关 NetBIOS（137-139），只听 445。
          server min protocol = SMB3
          server signing = required
          # 能协商加密就加密（SMB3 encryption），对吞吐的影响见 PR 实测。
          smb encrypt = desired
          # 只认 passdb 里唯一的账号，拒绝 guest 和匿名，含匿名枚举。
          map to guest = never
          restrict anonymous = 2
          disable netbios = yes
          smb ports = 445
          load printers = no
          printing = bsd
          printcap name = /dev/null
          disable spoolss = yes
          dns proxy = no
          local master = no
          log level = 1
          unix charset = UTF-8
          mangled names = no
          # macOS 客户端兼容：文件名编码与扩展属性。
          vfs objects = catia fruit streams_xattr
          fruit:metadata = stream
          fruit:model = MacSamba

      [photos]
          path = /shares/photos
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb

      [documents]
          path = /shares/documents
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb

      [music]
          path = /shares/music
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb

      [downloads]
          path = /shares/downloads
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb

      [transfers]
          path = /shares/transfers
          read only = no
          guest ok = no
          browseable = yes
          force user = ${WONTON_OWNER_NAME}
          force group = smb
  samba-pass:
    content: "${WONTON_SECRET_SAMBA_PASSWORD}"
  serve-py:
    file: web/serve.py
  web-pass:
    content: "${WONTON_SECRET_SAMBA_PASSWORD}"

x-wonton:
  spec: "0.4"
  id: org.samba.samba
  version: 0.1.0
  kind: app
  title: { zh: Samba 文件共享, en: Samba File Sharing }
  description: { zh: 局域网里的电脑直接挂载家里的共享文件夹, en: Mount your shared folders from computers on the LAN }
  icon: icon.png
  notices: [NOTICE]
  category: files
  screenshots: [screenshots/web.png, screenshots/web-dark.png]
  author: { name: geraldpeng6 }
  homepage: https://www.samba.org
  license: GPL-3.0-or-later
  tags: [samba, smb, nas, 文件共享, 局域网, file-share, lan]
  about:
    zh: |
      把家里的共享文件夹（照片、文档、音乐、下载、传输）导出成 SMB 共享，局域网里的电脑直接挂载：macOS 在
      Finder 的“连接服务器”里输 smb://地址/共享名，Windows 在资源管理器输 \\地址\共享名，Linux 文件管理器
      连 smb://地址。读写照片、文档、音乐和设备传进来的文件，新建的文件都归主人的用户。

      只在局域网开放 445 端口，不开发现服务，也不通互联网；最低 SMB3 协议，开签名，能协商加密就加密。
      插件网页显示连接地址、用户名和密码，可以点按复制。

      SMB 的账号密码和网关的单点登录是分开的：网页里给的密码就是电脑连接时用的密码。
    en: |
      Exports your shared folders (photos, documents, music, downloads, transfers) as SMB shares that
      computers on the LAN mount directly: use smb://address/share in macOS Finder, \\address\share in
      Windows Explorer, or smb://address in Linux file managers. Read and write photos, documents,
      music and files sent from devices; new files are owned by the owner's account.

      Only port 445 is open on the LAN, no discovery services, nothing reaches the internet. Minimum
      protocol SMB3, signing required, encryption negotiated when the client supports it. The plugin
      page shows the addresses, username and password, each tap-to-copy.

      The SMB account is separate from the gateway's single sign-on: the password shown on the page is
      the one computers use to connect.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: web
    port: 8080
    sso: proxy
    proxy:
      headers:
        Remote-User: "{user}"
  secrets:
    samba_password:
      generate: { bytes: 32 }
  lan:
    ports:
      - { service: samba, port: 445 }
  permissions:
    - network.lan
    - storage.share.photos:write
    - storage.share.documents:write
    - storage.share.music:write
    - storage.share.downloads:write
    - storage.share.transfers:write
    - owner.identity
